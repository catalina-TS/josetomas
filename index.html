<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivo.exe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ventana fija: es la página completa, no se abre desde un escritorio.
       Todo lo que ve la usuaria vive adentro de esta ventana. -->
  <div class="ventana" id="ventana">
    <!-- Barra de título falsa, estilo ventana de Windows/Mac viejo. Los
         "puntos" son solo decorativos, no cierran/minimizan nada de verdad. -->
    <div class="barra-titulo">
      <div class="botones">
        <span class="punto llena"></span>
        <span class="punto"></span>
        <span class="punto"></span>
      </div>
      <span class="titulo">ARCHIVO.EXE</span>
      <!-- Botoncito secreto: abre el aviso oculto (abrirAvisoSecreto() en script.js). -->
      <span class="espacio">
        <button class="btn-corazon" id="btn-corazon" title="¿?" aria-label="Archivo oculto">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="currentColor"/></svg>
        </button>
      </span>
    </div>
    <div class="cuerpo">
      <!-- Archivador: acá script.js dibuja una CARPETA por categoría
           (construirSidebar() en script.js llena este <ul>). Mientras no
           hay ninguna abierta se ven todas paradas, una junto a otra; al
           abrir una, las demás se achican a pestañas arriba del contenido. -->
      <nav class="archivador">
        <p class="archivador-titulo">ARCHIVO // elige una carpeta</p>
        <ul class="lista-categorias" id="lista-categorias"></ul>
      </nav>
      <!-- Contenido: la carpeta desplegada. El nombre de la categoría + el
           contador se llenan en mostrarGaleria() (script.js). El <div id="galeria">
           es el "lienzo" que se reescribe entero cada vez que cambio de vista
           (galería, ficha o formulario) - todo pasa por su .innerHTML. -->
      <div class="contenido" id="contenido">
        <div class="contenido-header">
          <h2 id="titulo-categoria"></h2>
          <div class="contenido-header-derecha">
            <span class="contador" id="contador-entradas"></span>
            <button class="btn-retro" id="btn-cerrar-carpeta" title="Volver al archivador">✕ cerrar carpeta</button>
          </div>
        </div>
        <div class="galeria" id="galeria"></div>
      </div>
    </div>
  </div>

  <!-- script.js se conecta a mi backend (bit-cora-backend, en localhost:3000
       mientras desarrollo) para guardar y leer las entradas - ya NO usa
       localStorage. Necesita que "node index.js" esté corriendo para funcionar. -->
  <script src="script.js"></script>
</body>
</html>
